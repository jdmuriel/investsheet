app = 'investsheet'
primary_region = 'cdg'

[env]
  ORIGIN = 'https://invest.jdmuriel.com'
  BODY_SIZE_LIMIT = '50M'

[http_service]
  internal_port = 3000
  force_https = true
  # La máquina se para sola sin tráfico y arranca con la primera petición.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = 'GET'
    path = '/health'
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'

[mounts]
  source = 'data'
  destination = '/data'
  initial_size = '1gb'
  snapshot_retention = 30

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
